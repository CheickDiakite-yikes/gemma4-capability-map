<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" role="img" aria-labelledby="title desc">
<title id="title">H2r composed route gating solves H2q locally</title>
<desc id="desc">H2r reaches eight of eight exact rows on H2q, compared with three of eight for H2p.</desc>
<rect width="820" height="350" fill="#FFFFFF"/>
<text x="32" y="36" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">H2r solves the H2q boundary locally</text>
<line x1="82" y1="252" x2="700" y2="252" stroke="#111827" stroke-width="1"/>
<line x1="76" y1="252.0" x2="700" y2="252.0" stroke="#E5E7EB" stroke-width="1"/>
<text x="36" y="256.0" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">0.0</text>
<line x1="76" y1="214.0" x2="700" y2="214.0" stroke="#E5E7EB" stroke-width="1"/>
<text x="36" y="218.0" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">0.2</text>
<line x1="76" y1="176.0" x2="700" y2="176.0" stroke="#E5E7EB" stroke-width="1"/>
<text x="36" y="180.0" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">0.4</text>
<line x1="76" y1="138.0" x2="700" y2="138.0" stroke="#E5E7EB" stroke-width="1"/>
<text x="36" y="142.0" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">0.6</text>
<line x1="76" y1="100.0" x2="700" y2="100.0" stroke="#E5E7EB" stroke-width="1"/>
<text x="36" y="104.0" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">0.8</text>
<line x1="76" y1="62.0" x2="700" y2="62.0" stroke="#E5E7EB" stroke-width="1"/>
<text x="36" y="66.0" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">1.0</text>
<rect x="82" y="228.2" width="72" height="23.8" fill="#0891B2"/>
<text x="100" y="220.2" font-family="Arial, sans-serif" font-size="13" fill="#111827">1/8</text>
<text x="100" y="280" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">H2e</text>
<rect x="204" y="252.0" width="72" height="0.0" fill="#7C3AED"/>
<text x="222" y="244.0" font-family="Arial, sans-serif" font-size="13" fill="#111827">0/8</text>
<text x="222" y="280" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">H2n</text>
<rect x="326" y="204.5" width="72" height="47.5" fill="#047857"/>
<text x="344" y="196.5" font-family="Arial, sans-serif" font-size="13" fill="#111827">2/8</text>
<text x="344" y="280" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">H2o</text>
<rect x="448" y="180.8" width="72" height="71.2" fill="#B45309"/>
<text x="466" y="172.8" font-family="Arial, sans-serif" font-size="13" fill="#111827">3/8</text>
<text x="466" y="280" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">H2p</text>
<rect x="570" y="62.0" width="72" height="190.0" fill="#B91C1C"/>
<text x="588" y="54.0" font-family="Arial, sans-serif" font-size="13" fill="#111827">8/8</text>
<text x="588" y="280" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">H2r</text>
<text x="32" y="318" font-family="Arial, sans-serif" font-size="13" fill="#374151">H2r adds five composed-route interventions: two stale-selection rewrites and three requested-surface restorations.</text>
