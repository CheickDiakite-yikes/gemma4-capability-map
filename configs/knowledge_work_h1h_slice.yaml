h1_slice:
  name: knowledge_work_h1h_mlx_full_tool_contract_ablation
  version: v1
  description: >
    Full-size successor to H1f. H1h expands the no-directive MLX tool-contract
    ablation from the compact five-workflow controller-stress set to the full
    H1e ten-workflow live packaged-workflow surface, preserving attribution to
    workflow families while testing whether the H1f causal ordering survives
    across resume, visual referent, approval, API, and CLI pressure.
  run_intent: exploratory
  update_latest: false
  live_entrypoint: packaged_workflows_only
  primary_system_id: mlx_gemma4_e2b_reasoner_only
  baseline_system_ids:
    - oracle_gemma4_e2b
    - hf_service_gemma4_specialists_cpu
  ablation_bundle_system_id: mlx_gemma4_e2b_reasoner_only
  ablation_system_ids:
    - mlx_gemma4_e2b_reasoner_only
    - mlx_gemma4_e2b_reasoner_only_no_tool_turn_directive
    - mlx_gemma4_e2b_reasoner_only_no_tool_turn_directive_no_controller_repair
    - mlx_gemma4_e2b_reasoner_only_no_tool_turn_directive_no_controller_fallback
    - mlx_gemma4_e2b_reasoner_only_no_tool_turn_directive_no_argument_repair
  lanes:
    replayable_core:
      episode_ids:
        - kwa_exec_backlog_resume_hold_v5
        - kwa_exec_visual_dashboard_brief
        - kwa_jobs_email_block_resume_hold_v5
        - kwa_finance_diff_review_hold_v5
        - kwa_finance_invoice_lock_direction_hold_v4
        - kwa_exec_visual_dashboard_referent_hold_v3
        - kwa_exec_latest_action_resume_hold_v4
        - kwa_jobs_visual_constraint_override_hold_v2
        - kwa_jobs_phone_patch_resume_hold_v4
        - kwa_finance_visual_invoice_revision_hold_v2
    live_web_stress:
      episode_ids:
        - kwa_exec_live_backlog_resume_hold_v5
        - kwa_exec_live_visual_dashboard_brief
        - kwa_jobs_live_email_block_resume_hold_v5
        - kwa_finance_live_diff_review_hold_v5
        - kwa_finance_live_invoice_lock_direction_hold_v4
        - kwa_exec_live_visual_dashboard_referent_hold_v3
        - kwa_exec_live_latest_action_resume_hold_v4
        - kwa_jobs_live_visual_constraint_override_hold_v2
        - kwa_jobs_live_phone_patch_resume_hold_v4
        - kwa_finance_live_visual_invoice_revision_hold_v2
  workflow_families:
    - workflow_id: executive_stale_brief_packet
      role_family: executive_assistant
      purpose: stress resume/project-memory handling and approval-safe stops under latest backlog direction
      replayable_episode_id: kwa_exec_backlog_resume_hold_v5
      live_episode_id: kwa_exec_live_backlog_resume_hold_v5
      h1_stressors:
        - project_memory_resume
        - approval_safe_stop
        - direction_following_latest_instruction
    - workflow_id: executive_visual_dashboard_review
      role_family: executive_assistant
      purpose: isolate clean dashboard visual stepwise control and readback
      replayable_episode_id: kwa_exec_visual_dashboard_brief
      live_episode_id: kwa_exec_live_visual_dashboard_brief
      h1_stressors:
        - visual_stepwise_control
        - argument_copying
    - workflow_id: jobs_visual_form_hold
      role_family: job_application_ops
      purpose: preserve latest blocked-email direction through CLI patching, visual refinement, and approval hold
      replayable_episode_id: kwa_jobs_email_block_resume_hold_v5
      live_episode_id: kwa_jobs_live_email_block_resume_hold_v5
      h1_stressors:
        - cli_canonicalization
        - visual_stepwise_control
        - approval_safe_stop
    - workflow_id: finance_billing_patch_hold
      role_family: finance
      purpose: preserve review-only finance direction while API and CLI evidence disagree
      replayable_episode_id: kwa_finance_diff_review_hold_v5
      live_episode_id: kwa_finance_live_diff_review_hold_v5
      h1_stressors:
        - api_canonicalization
        - cli_diff_review_only
        - approval_safe_stop
    - workflow_id: finance_visual_invoice_review
      role_family: finance
      purpose: preserve invoice-lock approval posture across visual and CLI evidence
      replayable_episode_id: kwa_finance_invoice_lock_direction_hold_v4
      live_episode_id: kwa_finance_live_invoice_lock_direction_hold_v4
      h1_stressors:
        - cli_canonicalization
        - visual_evidence
        - approval_safe_stop
    - workflow_id: executive_visual_referent_review
      role_family: executive_assistant
      purpose: carry current dashboard referents through latest-filter revision pressure
      replayable_episode_id: kwa_exec_visual_dashboard_referent_hold_v3
      live_episode_id: kwa_exec_live_visual_dashboard_referent_hold_v3
      h1_stressors:
        - visual_referent_carryover
        - latest_filter
    - workflow_id: executive_latest_action_resume
      role_family: executive_assistant
      purpose: resume a visual executive packet and preserve latest action over stale context
      replayable_episode_id: kwa_exec_latest_action_resume_hold_v4
      live_episode_id: kwa_exec_live_latest_action_resume_hold_v4
      h1_stressors:
        - project_memory_resume
        - visual_latest_action
        - approval_safe_stop
    - workflow_id: jobs_visual_constraint_override
      role_family: job_application_ops
      purpose: preserve a latest form constraint while avoiding stale visual/submission state
      replayable_episode_id: kwa_jobs_visual_constraint_override_hold_v2
      live_episode_id: kwa_jobs_live_visual_constraint_override_hold_v2
      h1_stressors:
        - visual_constraint_override
        - approval_safe_stop
    - workflow_id: jobs_phone_patch_resume
      role_family: job_application_ops
      purpose: carry latest phone issue through API fetch, visual readback, CLI patch, and approval hold
      replayable_episode_id: kwa_jobs_phone_patch_resume_hold_v4
      live_episode_id: kwa_jobs_live_phone_patch_resume_hold_v4
      h1_stressors:
        - api_canonicalization
        - visual_referent_carryover
        - cli_patch_only
    - workflow_id: finance_visual_invoice_revision
      role_family: finance
      purpose: revise finance note from invoice visual evidence while preserving current approval posture
      replayable_episode_id: kwa_finance_visual_invoice_revision_hold_v2
      live_episode_id: kwa_finance_live_visual_invoice_revision_hold_v2
      h1_stressors:
        - visual_invoice_revision
        - approval_safe_stop
  packets:
    mlx_full_tool_contract_breaker:
      lane: live_web_stress
      purpose: >
        Full live packaged-workflow packet for testing whether the H1f
        no-directive controller-helper ordering survives the H1e ten-workflow
        family surface.
      system_ids:
        - mlx_gemma4_e2b_reasoner_only
        - mlx_gemma4_e2b_reasoner_only_no_tool_turn_directive
        - mlx_gemma4_e2b_reasoner_only_no_tool_turn_directive_no_controller_repair
        - mlx_gemma4_e2b_reasoner_only_no_tool_turn_directive_no_controller_fallback
        - mlx_gemma4_e2b_reasoner_only_no_tool_turn_directive_no_argument_repair
      episode_ids:
        - kwa_exec_live_backlog_resume_hold_v5
        - kwa_exec_live_visual_dashboard_brief
        - kwa_jobs_live_email_block_resume_hold_v5
        - kwa_finance_live_diff_review_hold_v5
        - kwa_finance_live_invoice_lock_direction_hold_v4
        - kwa_exec_live_visual_dashboard_referent_hold_v3
        - kwa_exec_live_latest_action_resume_hold_v4
        - kwa_jobs_live_visual_constraint_override_hold_v2
        - kwa_jobs_live_phone_patch_resume_hold_v4
        - kwa_finance_live_visual_invoice_revision_hold_v2
      failure_modes:
        - prompt_contract_removed
        - visual_stepwise_control
        - visual_referent_carryover
        - api_canonicalization
        - cli_canonicalization
        - controller_fallback
        - argument_copying
        - approval_safe_stop
        - project_memory_resume
  saturation_breaker_metrics:
    - real_world_readiness_avg
    - strict_interface_avg
    - recovered_execution_avg
    - controller_repair_avg
    - controller_fallback_avg
    - argument_repair_avg
    - raw_planning_clean_rate_avg
  attribution_tags:
    - packaged_workflow
    - workflow_family
    - local_mlx_monolith
    - tool_turn_directive
    - prompt_contract_ablation
    - full_live_surface
